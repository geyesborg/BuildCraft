pluginManagement {
    repositories {
        maven { url = 'https://maven.cleanroommc.com' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'com.cleanroommc.cleanroomgradle.settings' version '0.17.4'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'buildcraft-legacy'
