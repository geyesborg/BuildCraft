import com.cleanroommc.gradle.api.task.mc.RunMinecraft

plugins {
    id 'java-library'
    id 'com.cleanroommc.cleanroomgradle'
}

group = 'com.mod-buildcraft'
version = providers.gradleProperty('mod_version').get()

def mcVersion = providers.gradleProperty('mc_version').get()
def forgeVersion = providers.gradleProperty('forge_version').get()

base {
    archivesName = 'buildcraft-legacy'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    mavenCentral()
}

def expressionDir = 'sub_projects/expression'
def expressionAutogen = layout.buildDirectory.dir('generated/sources/expression/java')
def buildInfoDir = layout.buildDirectory.dir('generated/sources/buildinfo/java')

sourceSets {
    main {
        java {
            srcDirs = ['common', 'common_old_license', 'BuildCraftAPI/api', "$expressionDir/src/main/java"]
            srcDir expressionAutogen
            srcDir buildInfoDir
        }
        resources {
            srcDirs = ['buildcraft_resources', 'BuildCraft-Localization', 'BuildCraftGuide/guide_resources']
            exclude '**/*.md', 'pack.png', 'pack.mcmeta'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java', "$expressionDir/src/test/java"]
        }
    }
    // Generates the expression library's NodeFunc*/NodeType* sources (was sub_projects:expression:generateSources)
    expressionGenerator {
        java {
            srcDirs = ["$expressionDir/src/generator/java"]
        }
        resources {
            srcDirs = ["$expressionDir/src/generator/resources"]
        }
    }
}

dependencies {
    implementation cleanroom.userdev('0.6.10') {
        // Dev runs with -Pbc_with_renderers: Celeritas reads vanilla fields its AT opens in production
        def celeritasAt = file('../celeritas/forge122/src/main/resources/META-INF/celeritas_at.cfg')
        if (celeritasAt.exists()) accessTransformers.from(celeritasAt)
    }
    // LWJGL 2 utility classes (org.lwjgl.util.glu.GLU, org.lwjgl.util.vector) that Cleanroom ships through LWJGLY
    compileOnly 'com.cleanroommc:lwjgly:1.0.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.findbugs:jsr305:3.0.2'
}

def generateExpressionSources = tasks.register('generateExpressionSources', JavaExec) {
    description = 'Generates the expression library sources (NodeFunc*, NodeType*, FunctionContext*).'
    classpath = sourceSets.expressionGenerator.runtimeClasspath
    mainClass = 'buildcraft.meta.generate.AutoGenerator'
    def out = expressionAutogen.get().asFile
    inputs.files(sourceSets.expressionGenerator.allSource)
    outputs.dir(out)
    doFirst {
        project.delete(out)
        out.mkdirs()
    }
    args '-out', out.absolutePath, '-run', '-quiet'
}

def gitOutput = { String... args ->
    try {
        def proc = (['git'] + args.toList()).execute(null, rootDir)
        def text = proc.text.trim()
        return proc.waitFor() == 0 ? text : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}

// Replaces the ForgeGradle source token replacement ($version, ${git_commit_hash}, ...) in BCLib
def generateBuildInfo = tasks.register('generateBuildInfo') {
    description = 'Writes buildcraft.lib.BCBuildInfo (version and git details as compile-time constants).'
    def out = buildInfoDir.get().file('buildcraft/lib/BCBuildInfo.java').asFile
    def info = [
            VERSION          : version.toString(),
            MC_VERSION       : mcVersion,
            FORGE_VERSION    : forgeVersion,
            GIT_BRANCH       : gitOutput('rev-parse', '--abbrev-ref', 'HEAD'),
            GIT_COMMIT_HASH  : gitOutput('rev-parse', 'HEAD'),
            GIT_COMMIT_MSG   : gitOutput('log', '-1', '--format=%s'),
            GIT_COMMIT_AUTHOR: gitOutput('log', '-1', '--format=%an'),
    ]
    inputs.properties(info)
    outputs.file(out)
    doLast {
        def escape = { String s -> s.replace('\\', '\\\\').replace('"', '\\"') }
        def body = info.collect { k, v -> "    public static final String ${k} = \"${escape(v)}\";" }.join('\n')
        out.parentFile.mkdirs()
        out.setText("""package buildcraft.lib;

/** Generated by the build (generateBuildInfo). */
public final class BCBuildInfo {
${body}

    private BCBuildInfo() {}
}
""", 'UTF-8')
    }
}

tasks.named('compileJava') {
    dependsOn(generateExpressionSources, generateBuildInfo)
}
tasks.named('sourcesJar') {
    dependsOn(generateExpressionSources, generateBuildInfo)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

def modVersion = version.toString()
processResources {
    inputs.property('version', modVersion)
    inputs.property('mcversion', mcVersion)
    filesMatching('mcmod.info') {
        expand 'version': modVersion, 'mcversion': mcVersion
    }
}

test {
    useJUnit()
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy(tasks.named('reobfJar'))
}

tasks.named('reobfJar').configure {
    archiveClassifier.set('')
    doLast {
        def jarFile = outputs.files.files.find { it.name.endsWith('.jar') }
        def fs = java.nio.file.FileSystems.newFileSystem(jarFile.toPath(), (ClassLoader) null)
        try {
            // The renamer's decompiler hint file has no use in a mod jar
            java.nio.file.Files.deleteIfExists(fs.getPath('fernflower_abstract_parameter_names.txt'))
        } finally {
            fs.close()
        }
    }
}

// Dev client: run/cleanroom-client with the dev jar in mods/ (classes on the classpath would load
// BuildCraft twice). -Pbc_with_renderers=true also copies the gl46core and Celeritas dev jars.
def runDir = layout.projectDirectory.dir('run/cleanroom-client')
tasks.register('prepareBuildCraftRun', Copy) {
    dependsOn(tasks.named('jar'))
    from(tasks.named('jar').flatMap { it.archiveFile })
    if ((findProperty('bc_with_renderers') ?: 'false').toString().toBoolean()) {
        // Newest dev jar of each (MCP-named; Celeritas' production jar also ends in -dev.jar)
        def newest = { String dir, String suffix ->
            provider {
                file(dir).listFiles({ d, n -> n.endsWith(suffix) } as FilenameFilter)
                        ?.max { it.lastModified() } ?: []
            }
        }
        from(newest('../gl46core/build/libs', '-dev.jar'))
        from(newest('../celeritas/forge122/build/libs', '-dev-dev.jar'))
    }
    def modsDir = runDir.dir('mods').asFile
    into(modsDir)
    doFirst {
        modsDir.listFiles({ d, n -> n.endsWith('.jar') } as FilenameFilter)?.each { it.delete() }
    }
}

tasks.withType(RunMinecraft).configureEach {
    dependsOn(tasks.named('jar'))
    if (name == 'runClient') {
        dependsOn(tasks.named('prepareBuildCraftRun'))
        workingDir(runDir)
        jvmArgs '--enable-native-access=ALL-UNNAMED',
                '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
                '-Dbuildcraft.dev=true', '-Xmx3G'
        def extraArgs = findProperty('extra_jvm_args')
        if (extraArgs != null && !extraArgs.toString().trim().isEmpty()) {
            jvmArgs(*extraArgs.toString().trim().split('\\s+'))
        }
        def classesDir = layout.buildDirectory.dir('classes/java/main')
        def resourcesDir = layout.buildDirectory.dir('resources/main')
        doFirst {
            classpath = classpath.filter {
                !it.canonicalPath.equals(classesDir.get().asFile.canonicalPath) &&
                        !it.canonicalPath.equals(resourcesDir.get().asFile.canonicalPath) &&
                        // com.mojang:patchy shades a Netty 4.1 Bootstrap that mismatches Cleanroom's Netty 4.2
                        !it.name.startsWith('patchy-')
            }
        }
    }
}
